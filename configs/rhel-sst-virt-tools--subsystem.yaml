document: feedback-pipeline-workload
version: 1
data:
  name: Virtualization Tools
  description: Libvirt and virt-tools that enable virtualization capabilities on RHEL
  maintainer: rhel-sst-virt-tools
  packages:
    - augeas
    - guestfs-tools
    - hexedit
    - hivex
    - libguestfs
    - libguestfs-inspect-icons
    - libosinfo
    - libvirt
    - libvirt-dbus
    - libvirt-glib
    - mdevctl
    - osinfo-db
    - osinfo-db-tools
    - python3-libvirt
    - supermin
    - virt-install
    - virt-top
    - virt-viewer
    - virt-what
  labels:
    - eln
    - c10s
  arch_packages:
    x86_64:
      - virt-p2v
      - virt-v2v
      - virt-win-reg
    aarch64:
      - virt-win-reg
  package_placeholders:
    # RHEL-specific package, not in Fedora
    - srpm_name: libguestfs-fssupport
      build_dependencies:
        - autoconf
        - automake
        - e2fsprogs-devel
        - elfutils-libelf-devel
        - gcc
        - gnupg2
        - kernel-abi-stablelists
        - kernel-devel-uname-r
        - kernel-rpm-macros
        - kmod
        - libacl-devel
        - libblkid-devel
        - libgcrypt-devel
        - libuuid-devel
        - libzstd-devel
        - lzo-devel
        - make
        - systemd
        - systemd-devel
        - xz
        - zlib-ng-compat-devel
      rpms:
        - rpm_name: libguestfs-fssupport
          description: Btrfs filesystem support for virt-v2v
          dependencies:
            - kernel-uname-r
            - libguestfs
    # RHEL-specific package, not in Fedora
    - srpm_name: libguestfs-winsupport
      build_dependencies:
        - autoconf
        - automake
        - libtool
        - fuse-devel
        - gnutls-devel
        - libattr-devel
        - libconfig-devel
        - libgcrypt-devel
        - libuuid-devel
      limit_arches:
        - x86_64
      rpms:
        - rpm_name: libguestfs-winsupport
          description: Add support for Windows guests to virt-v2v and virt-p2v
          dependencies:
            - libguestfs
